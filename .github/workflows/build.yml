name: Build KernelSU-Next 33355 (v5) IMG for d2x

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex libssl-dev libncurses5-dev lzop zip unzip python3 python-is-python3

      - name: Clone LineageOS 23.2 Kernel Source
        run: |
          GH="https://""github.com"
          git clone --depth=1 -b lineage-23.2 "$GH/LineageOS/android_kernel_samsung_exynos9820.git" kernel

      - name: Setup Clang (r563880c)
        run: |
          GH="https://""github.com"
          mkdir -p toolchain/clang
          curl -fL "$GH/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r563880c.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain/clang
          rm clang.tar.gz

      - name: Integrate KernelSU-Next (33355) & Apply 4.14 Hooks
        run: |
          GH="https://""github.com"
          cd kernel
          git clone "$GH/KernelSU-Next/KernelSU-Next.git" KernelSU-Next
          cd KernelSU-Next
          git checkout legacy || git checkout next
          COMMIT_33355=$(git log --all --grep="33355" --format="%H" -n 1)
          if [ -z "$COMMIT_33355" ]; then
            COMMIT_33355=$(git log --until="2026-10-15" --format="%H" -n 1)
          fi
          echo "Using KernelSU-Next commit: $COMMIT_33355"
          git checkout "$COMMIT_33355"
          cd ..
          
          ln -sf "$(pwd)/KernelSU-Next/kernel" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          python3 - << 'EOF'
          def p(path, old, new):
              s = open(path).read()
              if new.splitlines()[0] not in s:
                  assert old in s, f"Not found in {path}: {old}"
                  open(path, "w").write(s.replace(old, new, 1))
                  print("Patched", path)

          p("fs/exec.c", "static int do_execveat_common(int fd, struct filename *filename,",
            "#ifdef CONFIG_KSU\nextern bool ksu_execveat_hook __read_mostly;\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\nstatic int do_execveat_common(int fd, struct filename *filename,")
          p("fs/exec.c", "if (IS_ERR(filename))",
            "#ifdef CONFIG_KSU\n\tif (unlikely(ksu_execveat_hook))\n\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\telse\n\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\tif (IS_ERR(filename))")

          p("fs/open.c", "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)",
            "#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\nSYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)")
          p("fs/open.c", "if (mode & ~S_IRWXO)",
            "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\tif (mode & ~S_IRWXO)")

          p("fs/read_write.c", "ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)",
            "#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif\nssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)")
          p("fs/read_write.c", "if (!(file->f_mode & FMODE_READ))",
            "#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif\n\tif (!(file->f_mode & FMODE_READ))")

          p("fs/stat.c", "int vfs_statx(int dfd, const char __user *filename, int flags,",
            "#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\nint vfs_statx(int dfd, const char __user *filename, int flags,")
          p("fs/stat.c", "if ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |",
            "#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif\n\tif ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |")

          p("drivers/input/input.c", "void input_event(struct input_dev *dev,",
            "#ifdef CONFIG_KSU\nextern bool ksu_input_hook __read_mostly;\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif\nvoid input_event(struct input_dev *dev,")
          p("drivers/input/input.c", "if (is_event_supported(type, dev->evbit, EV_MAX)) {",
            "#ifdef CONFIG_KSU\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n#endif\n\tif (is_event_supported(type, dev->evbit, EV_MAX)) {")

          p("kernel/reboot.c", "SYSCALL_DEFINE4(reboot,",
            "#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\nSYSCALL_DEFINE4(reboot,")
          p("kernel/reboot.c", "if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))",
            "#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\tif (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))")
          EOF

      - name: Configure and Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 exynos9820-d2x_defconfig
          ./scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK -e OVERLAY_FS -d KPROBES -d KSU_KPROBES_HOOK -d KSU_KPROBE_HOOKS
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E "CONFIG_KSU|CONFIG_OVERLAY_FS" out/.config
          grep -q "CONFIG_KSU=y" out/.config
          
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Repack boot.img with Magiskboot
        run: |
          GH="https://""github.com"
          MIR="https://""mirrorbits.lineageos.org"
          curl -fL "$MIR/full/d2x/20261115/boot.img" -o boot.img
          curl -fL "$GH/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -o magisk.apk
          unzip -o magisk.apk lib/x86_64/libmagiskboot.so -d .
          mv lib/x86_64/libmagiskboot.so magiskboot && chmod +x magiskboot
          
          cd /tmp
          cp "$GITHUB_WORKSPACE/boot.img" .
          "$GITHUB_WORKSPACE/magiskboot" unpack boot.img || true
          cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" kernel
          "$GITHUB_WORKSPACE/magiskboot" repack boot.img boot_ksu.img
          mv boot_ksu.img "$GITHUB_WORKSPACE/boot_ksu.img"

      - name: Upload boot_ksu.img
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu
          path: boot_ksu.img
