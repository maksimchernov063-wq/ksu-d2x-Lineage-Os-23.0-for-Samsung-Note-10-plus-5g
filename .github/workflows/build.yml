name: Build KernelSU-Next Legacy IMG for d2x

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex libssl-dev libncurses5-dev lzop zip unzip python3 python-is-python3 mkbootimg jq

      - name: Clone LineageOS 23.2 Kernel Source
        run: |
          GH="https://github.com"
          git clone --depth=1 -b lineage-23.2 "$GH/LineageOS/android_kernel_samsung_exynos9820.git" kernel

      - name: Setup Clang (r563880c)
        run: |
          mkdir -p toolchain/clang
          curl -LO "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r563880c.tar.gz"
          tar -xzf clang-r563880c.tar.gz -C toolchain/clang
          rm clang-r563880c.tar.gz

      - name: Integrate KernelSU-Next (legacy for 4.14)
        run: |
          RAW="https://raw.githubusercontent.com"
          cd kernel
          curl -LSs "$RAW/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          DEFCONFIG="arch/arm64/configs/exynos9820-d2x_defconfig"
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG

      - name: Compile Kernel with LLVM
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 exynos9820-d2x_defconfig
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Unpack and Repack boot.img
        run: |
          MIR="https://mirrorbits.lineageos.org"
          GOOG="https://android.googlesource.com"
          
          curl -fL "$MIR/full/d2x/20261115/boot.img" -o boot.img
          curl -fL "$GOOG/platform/system/tools/mkbootimg/+/refs/heads/main/unpack_bootimg.py?format=TEXT" | base64 -d > unpack_bootimg.py
          
          python3 unpack_bootimg.py --boot_img boot.img --out unpacked
          
          if [ ! -f unpacked/mkbootimg_args.json ]; then
            echo "ERROR: mkbootimg_args.json not found!"
            exit 1
          fi
          
          python3 -c '
          import json, subprocess, os, sys

          with open("unpacked/mkbootimg_args.json") as f:
              args = json.load(f)

          allowed_keys = {
              "kernel_offset", "ramdisk_offset", "second_offset", "tags_offset",
              "dtb_offset", "pagesize", "header_version", "os_version", "os_patch_level",
              "cmdline", "base", "board", "dtb", "second"
          }

          cmd = [
              "mkbootimg",
              "--kernel", "kernel/out/arch/arm64/boot/Image",
              "--ramdisk", "unpacked/ramdisk",
              "-o", "boot_ksu.img"
          ]

          for k, v in args.items():
              if v is None or k not in allowed_keys:
                  continue

              val = str(v)
              if val.startswith("b\x27") and val.endswith("\x27"):
                  val = val[2:-1]
              elif val.startswith("b\"") and val.endswith("\""):
                  val = val[2:-1]

              if k in ("dtb", "second"):
                  file_path = os.path.join("unpacked", k)
                  if not os.path.exists(file_path):
                      continue
                  val = file_path

              cmd.extend([f"--{k}", val])

          subprocess.run(cmd, check=True)
          '

      - name: Upload boot_ksu.img
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu
          path: boot_ksu.img
