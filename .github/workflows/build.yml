name: Build KernelSU-Next ManualHooks IMG for d2x

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex libssl-dev libncurses5-dev lzop zip unzip python3 python-is-python3

      - name: Clone LineageOS 23.2 Kernel Source
        run: |
          GH="https://""github.com"
          git clone --depth=1 -b lineage-23.2 "$GH/LineageOS/android_kernel_samsung_exynos9820.git" kernel

      - name: Setup Clang (r563880c)
        run: |
          GH="https://""github.com"
          mkdir -p toolchain/clang
          curl -fL "$GH/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r563880c.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain/clang
          rm clang.tar.gz

      - name: Integrate KernelSU-Next & Apply Manual Hooks for 4.14
        run: |
          RAW="https://""raw.githubusercontent.com"
          cd kernel
          curl -LSs "$RAW/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          python3 - << 'EOF'
          def patch_file(path, target, replacement):
              with open(path, "r") as f:
                  content = f.read()
              assert target in content, f"Target not found in {path}"
              content = content.replace(target, replacement, 1)
              with open(path, "w") as f:
                  f.write(content)
              print(f"Patched {path} successfully")

          patch_file(
              "fs/exec.c",
              "static int do_execveat_common(int fd, struct filename *filename,",
              "extern bool ksu_execveat_hook __read_mostly;\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nstatic int do_execveat_common(int fd, struct filename *filename,"
          )
          patch_file(
              "fs/exec.c",
              "if (IS_ERR(filename))",
              "if (unlikely(ksu_execveat_hook))\n\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\telse\n\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n\tif (IS_ERR(filename))"
          )
          patch_file(
              "fs/open.c",
              "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)",
              "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\nSYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)"
          )
          patch_file(
              "fs/open.c",
              "if (mode & ~S_IRWXO)",
              "ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n\tif (mode & ~S_IRWXO)"
          )
          patch_file(
              "fs/read_write.c",
              "ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)",
              "extern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\nssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)"
          )
          patch_file(
              "fs/read_write.c",
              "if (!(file->f_mode & FMODE_READ))",
              "if (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n\tif (!(file->f_mode & FMODE_READ))"
          )
          patch_file(
              "fs/stat.c",
              "int vfs_statx(int dfd, const char __user *filename, int flags,",
              "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\nint vfs_statx(int dfd, const char __user *filename, int flags,"
          )
          patch_file(
              "fs/stat.c",
              "if ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |",
              "ksu_handle_stat(&dfd, &filename, &flags);\n\tif ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |"
          )
          patch_file(
              "drivers/input/input.c",
              "void input_event(struct input_dev *dev,",
              "extern bool ksu_input_hook __read_mostly;\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\nvoid input_event(struct input_dev *dev,"
          )
          patch_file(
              "drivers/input/input.c",
              "if (is_event_supported(type, dev->evbit, EV_MAX)) {",
              "if (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n\tif (is_event_supported(type, dev->evbit, EV_MAX)) {"
          )
          EOF

      - name: Configure and Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 exynos9820-d2x_defconfig
          ./scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK -e OVERLAY_FS -d KPROBES -d KSU_KPROBE_HOOKS
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E "CONFIG_KSU|CONFIG_OVERLAY_FS" out/.config
          
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Repack boot.img with Magiskboot
        run: |
          GH="https://""github.com"
          MIR="https://""mirrorbits.lineageos.org"
          curl -fL "$MIR/full/d2x/20261115/boot.img" -o boot.img
          curl -fL "$GH/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -o magisk.apk
          unzip -o magisk.apk lib/x86_64/libmagiskboot.so -d .
          mv lib/x86_64/libmagiskboot.so magiskboot && chmod +x magiskboot
          
          cd /tmp
          cp "$GITHUB_WORKSPACE/boot.img" .
          "$GITHUB_WORKSPACE/magiskboot" unpack boot.img || true
          cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" kernel
          "$GITHUB_WORKSPACE/magiskboot" repack boot.img boot_ksu.img
          mv boot_ksu.img "$GITHUB_WORKSPACE/boot_ksu.img"

      - name: Upload boot_ksu.img
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu
          path: boot_ksu.img
